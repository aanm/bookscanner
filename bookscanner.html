<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Georgia, serif; background: #f7f3ed; color: #1a1a1a; padding: 20px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
  button { padding: 10px 20px; background: #3d3225; color: #f7f3ed; border: none; font-family: monospace; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; }
  button:hover { background: #5a4a3a; }
  button.outline { background: transparent; color: #3d3225; border: 1px solid #c8bfa8; }
  input[type=text] { padding: 10px; border: 1px solid #c8bfa8; background: #faf7f0; font-family: monospace; font-size: 13px; width: 100%; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .entry { display: flex; gap: 8px; margin-bottom: 16px; }
  .entry input { flex: 1; }
  .video-wrap { position: relative; display: none; margin-bottom: 16px; }
  .video-wrap video { margin-bottom: 0; display: block; }
  .flash { position: absolute; inset: 0; background: rgba(80,200,80,0.35); pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .flash.active { opacity: 1; }
  .scan-toast { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(0,0,0,0.8); color: #7f7; font-family: monospace; font-size: 13px; padding: 10px 14px; opacity: 0; transition: opacity 0.2s; text-align: center; }
  .scan-toast.active { opacity: 1; }
  #status { font-family: monospace; font-size: 12px; color: #8a7d6b; margin-bottom: 12px; }
  #error { font-family: monospace; font-size: 12px; color: #8b2500; margin-bottom: 12px; }
  #search { margin-bottom: 16px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th { text-align: left; font-family: monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #8a7d6b; border-bottom: 2px solid #c8bfa8; padding: 6px 8px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #3d3225; }
  th .arrow { font-size: 9px; margin-left: 3px; }
  td { padding: 8px; border-bottom: 1px solid #ddd5c8; vertical-align: top; }
  .count { font-family: monospace; font-size: 11px; color: #8a7d6b; margin-bottom: 16px; }
  .hidden-input { display: none; }
</style>
</head>
<body>

<h1>Book Scanner</h1>
<div class="count" id="count">0 books scanned</div>

<div class="controls">
  <button onclick="toggleScan()" id="scanBtn">⎗ Scan Barcode</button>
  <button class="outline" onclick="downloadCsv()">↓ Download CSV</button>
  <button class="outline" onclick="document.getElementById('csvUpload').click()">↑ Upload CSV</button>
  <input type="file" id="csvUpload" class="hidden-input" accept=".csv" onchange="uploadCsv(event)">
</div>

<div class="video-wrap" id="videoWrap">
  <video id="video" playsinline muted style="width:100%;max-height:35vh;object-fit:cover;border:1px solid #c8bfa8;"></video>
  <div class="flash" id="flash"></div>
  <div class="scan-toast" id="scanToast"></div>
</div>

<div class="entry">
  <input type="text" id="isbn" placeholder="Type ISBN and press Enter" onkeydown="if(event.key==='Enter')addIsbn()">
  <button onclick="addIsbn()">+ Add</button>
</div>

<div id="error"></div>
<div id="status"></div>

<div id="search">
  <input type="text" id="searchInput" placeholder="Search title, author, or ISBN…" oninput="updateTable()">
</div>

<table id="table" style="display:none">
  <thead><tr>
    <th onclick="sortBy('isbn')">ISBN <span class="arrow" id="arrow_isbn"></span></th>
    <th onclick="sortBy('title')">Title <span class="arrow" id="arrow_title"></span></th>
    <th onclick="sortBy('authors')">Author <span class="arrow" id="arrow_authors"></span></th>
    <th>Publisher</th>
    <th>Year</th>
    <th>Pages</th>
    <th onclick="sortBy('addedAt')">Added <span class="arrow" id="arrow_addedAt"></span></th>
    <th>Work</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const books = [];
let scanning = false;
let stream = null;
let interval = null;
const recentScans = new Map();
const SCAN_COOLDOWN = 5000;
let sortField = 'addedAt';
let sortDir = -1;

function beep(success) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (success) {
      osc.frequency.value = 880; gain.gain.value = 0.15;
      osc.start(); osc.stop(ctx.currentTime + 0.12);
    } else {
      osc.frequency.value = 330; gain.gain.value = 0.12;
      osc.start(); osc.stop(ctx.currentTime + 0.08);
      setTimeout(() => {
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.frequency.value = 330; g2.gain.value = 0.12;
        o2.start(); o2.stop(ctx.currentTime + 0.08);
      }, 120);
    }
  } catch {}
}

function showScanFeedback(msg, isError) {
  const flash = document.getElementById('flash');
  const toast = document.getElementById('scanToast');
  flash.style.background = isError ? 'rgba(200,60,30,0.3)' : 'rgba(80,200,80,0.35)';
  flash.classList.add('active');
  toast.textContent = msg;
  toast.style.color = isError ? '#faa' : '#7f7';
  toast.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 300);
  setTimeout(() => toast.classList.remove('active'), 2000);
}

function status(msg) { document.getElementById('status').textContent = msg; }
function error(msg) { document.getElementById('error').textContent = msg; setTimeout(() => document.getElementById('error').textContent = '', 4000); }

function sortBy(field) {
  if (sortField === field) sortDir *= -1;
  else { sortField = field; sortDir = 1; }
  updateTable();
}

function hasHeuristicDupe(book) {
  if (!book.authors || !book.pages) return false;
  const authWords = book.authors.toLowerCase().split(/[;,]/).map(s => s.trim()).filter(Boolean);
  const pg = Number(book.pages);
  if (!pg || !authWords.length) return false;
  return books.some(b => {
    if (b.isbn === book.isbn || !b.authors || !b.pages) return false;
    const bAuth = b.authors.toLowerCase().split(/[;,]/).map(s => s.trim()).filter(Boolean);
    const authMatch = authWords.some(a => bAuth.some(ba => a === ba || a.includes(ba) || ba.includes(a)));
    if (!authMatch) return false;
    const bPg = Number(b.pages);
    return bPg && Math.abs(pg - bPg) / Math.max(pg, bPg) <= 0.15;
  });
}

function updateTable() {
  document.getElementById('count').textContent = books.length + ' book' + (books.length !== 1 ? 's' : '') + ' scanned';
  const tbl = document.getElementById('table');
  const tbody = document.getElementById('tbody');
  const searchEl = document.getElementById('search');
  if (!books.length) { tbl.style.display = 'none'; searchEl.style.display = 'none'; return; }
  tbl.style.display = ''; searchEl.style.display = '';

  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  let filtered = books;
  if (q) filtered = books.filter(b => b.title.toLowerCase().includes(q) || b.authors.toLowerCase().includes(q) || b.isbn.includes(q));

  const sorted = [...filtered].sort((a, b) => {
    let va = a[sortField] || '', vb = b[sortField] || '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return va < vb ? -1 * sortDir : va > vb ? 1 * sortDir : 0;
  });

  ['isbn', 'title', 'authors', 'addedAt'].forEach(f => {
    const el = document.getElementById('arrow_' + f);
    if (el) el.textContent = sortField === f ? (sortDir === 1 ? '▲' : '▼') : '';
  });

  const workCounts = {};
  books.forEach(b => { if (b.workId) workCounts[b.workId] = (workCounts[b.workId] || 0) + 1; });

  tbody.innerHTML = sorted.map(b => {
    const isWorkDupe = b.workId && workCounts[b.workId] > 1;
    const isHeuDupe = !isWorkDupe && hasHeuristicDupe(b);
    const isDupe = isWorkDupe || isHeuDupe;
    const bg = isDupe ? ' style="background:#f5e6c8"' : '';
    const label = isWorkDupe ? '⚠ DUPE' : (isHeuDupe ? '⚠ LIKELY DUPE' : '');
    const dupeTag = label ? ` <span style="color:#b8860b;font-size:10px;font-family:monospace">${label}</span>` : '';
    const added = b.addedAt ? new Date(b.addedAt).toLocaleDateString() + ' ' + new Date(b.addedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    return `<tr${bg}><td style="font-family:monospace;font-size:11px">${b.isbn}</td><td><b>${b.title}</b>${dupeTag}</td><td><i>${b.authors}</i></td><td>${b.publisher}</td><td>${b.year}</td><td>${b.pages}</td><td style="font-family:monospace;font-size:10px;white-space:nowrap">${added}</td><td style="font-family:monospace;font-size:10px">${b.workId || ''}</td></tr>`;
  }).join('');
}

async function lookup(isbn, fromScanner) {
  const clean = isbn.replace(/[^0-9X]/gi, '');
  if (clean.length !== 10 && clean.length !== 13) { error('Invalid ISBN'); return; }
  if (fromScanner) {
    const last = recentScans.get(clean);
    if (last && Date.now() - last < SCAN_COOLDOWN) return;
    recentScans.set(clean, Date.now());
  }
  if (books.some(b => b.isbn === clean)) {
    if (fromScanner) { beep(false); showScanFeedback('Already in library', true); }
    else error('Already added');
    return;
  }
  if (fromScanner) { beep(true); showScanFeedback('Detected: ' + clean + ' — looking up…', false); }
  status('Looking up ' + clean + '…');
  try {
    let book = null;
    try {
      const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${clean}&format=json&jscmd=data`);
      const data = await res.json();
      const info = data['ISBN:' + clean];
      if (info) {
        let workId = '';
        try {
          const edRes = await fetch(`https://openlibrary.org/isbn/${clean}.json`);
          if (edRes.ok) {
            const edData = await edRes.json();
            if (edData.works?.[0]) workId = edData.works[0].key;
          }
        } catch {}
        book = { isbn: clean, title: info.title || '', authors: (info.authors || []).map(a => a.name).join('; '),
          publisher: (info.publishers || [])[0]?.name || '', year: info.publish_date || '',
          pages: info.number_of_pages || '', source: 'OpenLibrary', workId };
      }
    } catch {}
    if (!book) {
      try {
        const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${clean}`);
        const data = await res.json();
        if (data.totalItems > 0) {
          const v = data.items[0].volumeInfo;
          book = { isbn: clean, title: v.title || '', authors: (v.authors || []).join('; '),
            publisher: v.publisher || '', year: v.publishedDate || '',
            pages: v.pageCount || '', source: 'GoogleBooks', workId: '' };
        }
      } catch {}
    }
    if (!book) book = { isbn: clean, title: 'NOT FOUND', authors: '', publisher: '', year: '', pages: '', source: 'manual', workId: '' };
    book.addedAt = new Date().toISOString();
    books.push(book);

    let dupeWarning = '';
    if (book.workId) {
      const dupes = books.filter(b => b.workId === book.workId && b.isbn !== book.isbn);
      if (dupes.length) dupeWarning = ' ⚠ Also in library as: ' + dupes.map(d => '"' + d.title + '" (' + d.isbn + ')').join(', ');
    }
    if (!dupeWarning && book.authors && book.pages) {
      const authWords = book.authors.toLowerCase().split(/[;,]/).map(s => s.trim()).filter(Boolean);
      const pg = Number(book.pages);
      if (pg > 0 && authWords.length) {
        const suspects = books.filter(b => {
          if (b.isbn === book.isbn || !b.authors || !b.pages) return false;
          const bAuth = b.authors.toLowerCase().split(/[;,]/).map(s => s.trim()).filter(Boolean);
          const authMatch = authWords.some(a => bAuth.some(ba => a === ba || a.includes(ba) || ba.includes(a)));
          if (!authMatch) return false;
          const bPg = Number(b.pages);
          return bPg && Math.abs(pg - bPg) / Math.max(pg, bPg) <= 0.15;
        });
        if (suspects.length) dupeWarning = ' ⚠ Possible duplicate: ' + suspects.map(d => '"' + d.title + '" (' + d.isbn + ')').join(', ');
      }
    }
    updateTable();
    if (book.title === 'NOT FOUND') {
      status('ISBN ' + clean + ' saved — not found, edit in CSV');
      if (fromScanner) showScanFeedback('⚠ ' + clean + ' — not found, saved', true);
    } else {
      status('Added: ' + book.title + ' (' + book.source + ')' + dupeWarning);
      if (fromScanner) showScanFeedback('✓ ' + book.title + (dupeWarning ? ' ⚠ DUPLICATE' : ''), !!dupeWarning);
    }
    document.getElementById('isbn').value = '';
  } catch (e) { error('Lookup failed: ' + e.message); status(''); }
}

function addIsbn() { const v = document.getElementById('isbn').value.trim(); if (v) lookup(v); }

async function toggleScan() {
  if (scanning) { stopScan(); return; }
  const video = document.getElementById('video');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280 } });
    video.srcObject = stream; video.style.display = 'block';
    document.getElementById('videoWrap').style.display = 'block';
    await video.play(); scanning = true;
    document.getElementById('scanBtn').textContent = '■ Stop';
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8'] });
      interval = setInterval(async () => {
        try { const codes = await detector.detect(video); if (codes.length) lookup(codes[0].rawValue, true); } catch {}
      }, 500);
      status('Point camera at barcode…');
    } else status('BarcodeDetector not supported — use Chrome on Android, or type ISBN manually.');
  } catch (e) { error('Camera error: ' + e.message); }
}

function stopScan() {
  if (interval) clearInterval(interval);
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.getElementById('videoWrap').style.display = 'none';
  scanning = false;
  document.getElementById('scanBtn').textContent = '⎗ Scan Barcode';
  status('');
}

function downloadCsv() {
  if (!books.length) { error('No books to export'); return; }
  const header = 'ISBN,Title,Authors,Publisher,Year,Pages,AddedAt,WorkID\n';
  const rows = books.map(b =>
    [b.isbn, b.title, b.authors, b.publisher, b.year, b.pages, b.addedAt || '', b.workId || '']
      .map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')
  ).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([header + rows], { type: 'text/csv' }));
  a.download = 'book-catalog.csv';
  a.click();
}

function uploadCsv(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split('\n');
    if (lines.length < 2) { error('Empty CSV'); return; }
    const header = parseCSVLine(lines[0]);
    const idx = {};
    header.forEach((h, i) => { idx[h.trim().toLowerCase().replace(/[^a-z]/g, '')] = i; });
    let added = 0, skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const cols = parseCSVLine(lines[i]);
      const isbn = (cols[idx['isbn'] ?? 0] || '').replace(/[^0-9X]/gi, '');
      if (!isbn) continue;
      if (books.some(b => b.isbn === isbn)) { skipped++; continue; }
      books.push({
        isbn,
        title: cols[idx['title'] ?? 1] || '',
        authors: cols[idx['authors'] ?? 2] || '',
        publisher: cols[idx['publisher'] ?? 3] || '',
        year: cols[idx['year'] ?? 4] || '',
        pages: cols[idx['pages'] ?? 5] || '',
        addedAt: cols[idx['addedat'] ?? 6] || new Date().toISOString(),
        workId: cols[idx['workid'] ?? 7] || '',
        source: 'csv',
      });
      added++;
    }
    updateTable();
    status(`Imported ${added} book${added !== 1 ? 's' : ''}` + (skipped ? `, ${skipped} skipped (duplicate)` : ''));
    event.target.value = '';
  };
  reader.readAsText(file);
}

function parseCSVLine(line) {
  const result = [];
  let current = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; } else inQuotes = false; }
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(current); current = ''; }
      else current += ch;
    }
  }
  result.push(current);
  return result;
}
</script>
</body>
</html>
